; Wi-Fi CSI firmware for classic ESP32 (ESP-WROOM-32), built with ESP-IDF.
;
; One source file, two roles. Flash each board with its env:
;   pio run -e tx -t upload --upload-port /dev/cu.usbserial-XXXX   (sender, only needs power)
;   pio run -e rx -t upload --upload-port /dev/cu.usbserial-YYYY   (receiver, stays plugged into the laptop)
; Watch the raw output:
;   pio device monitor -e rx --port /dev/cu.usbserial-YYYY

[platformio]
src_dir = main

[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 921600
upload_speed = 921600

[env:tx]
build_flags = -DCSI_ROLE_TX=1

[env:rx]
build_flags = -DCSI_ROLE_TX=0
